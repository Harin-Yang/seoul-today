<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>오늘 어디 가지</title>
  <meta name="description" content="내 주변 서울 문화행사를 데이트·혼놀·친구와로 골라보는 지도">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171b" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="오늘 어디">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="주변 이벤트 지도"></div>

  <header class="topbar">
    <nav class="chips" id="labelChips" aria-label="라벨">
      <button class="chip on" data-label="all">전체</button>
      <button class="chip" data-label="date">💑 데이트</button>
      <button class="chip" data-label="solo">🎧 혼놀</button>
      <button class="chip" data-label="friends">👯 친구와</button>
      <button class="chip" data-label="saved">♥ 찜</button>
    </nav>
    <nav class="chips small" id="whenChips" aria-label="기간">
      <button class="chip on" data-when="today">오늘</button>
      <button class="chip" data-when="weekend">이번 주말</button>
      <button class="chip" data-when="week">7일 내</button>
      <button class="chip toggle" id="freeChip">무료만</button>
    </nav>
  </header>

  <button class="fab" id="locateBtn" aria-label="내 위치로">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>

  <section class="sheet" id="sheet" aria-label="이벤트 목록">
    <div class="sheet-head" id="sheetHead">
      <div class="grip"></div>
      <div class="sheet-title">
        <strong id="countText">불러오는 중…</strong>
        <span id="subText"></span>
      </div>
    </div>
    <div class="sheet-body" id="sheetBody">
      <ul class="list" id="list"></ul>
      <article class="detail" id="detail" hidden></article>
      <p class="foot" id="foot"></p>
    </div>
  </section>

  <div class="toast" id="toast" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
