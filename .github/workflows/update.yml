name: 매일 이벤트 업데이트

on:
  schedule:
    - cron: '0 21 * * *' # 매일 06:00 KST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update-events
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 문화행사 수집 (서울시·문화정보원·관광공사)
        run: |
          for i in 1 2 3; do
            node scripts/fetch-events.mjs --strict && exit 0
            echo "재시도 대기 ($i)"; sleep 90
          done
          node scripts/fetch-events.mjs
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Seoul date +%F) 이벤트 업데이트"
          # 수집 중에 다른 커밋이 올라왔으면 그 위로 올려서 다시 push
          for i in 1 2 3; do
            git pull --rebase -q && git push && exit 0
            sleep 5
          done
          exit 1
